# Ignite Academy — reverse proxy and static file server.
#
# Two jobs nginx does that gunicorn should not:
#   1. Serve /static off disk. Every PNG that goes through a Python worker
#      is a worker not answering a request.
#   2. Buffer slow clients, so a phone on bad school wifi occupies an nginx
#      connection rather than a gunicorn worker for the length of upload.

upstream ignite_app {
    server app:8000;
    keepalive 32;
}

# Rate limit at the edge as well as in the app. This one costs no database
# round-trip, so it absorbs a flood before it reaches Python at all.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

server {
    listen 80;
    server_name _;

    # ACME challenges must stay on HTTP for certificate renewal.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Keep this in step with MAX_CONTENT_LENGTH in app.py.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static: straight off disk, never through Python ──────────────────
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── Auth endpoints: the tightest limit ────────────────────────────────
    location ~ ^/(login|signup|forgot|reset|verify) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://ignite_app;
        include /etc/nginx/proxy_params_ignite;
    }

    # Stripe bursts on retry, and rate-limiting a webhook makes Stripe
    # retry harder and eventually disable the endpoint. It authenticates
    # itself with a signature over the body, so the edge limit adds nothing.
    location /stripe/webhook {
        proxy_pass http://ignite_app;
        include /etc/nginx/proxy_params_ignite;
    }

    location /healthz {
        access_log off;
        proxy_pass http://ignite_app;
        include /etc/nginx/proxy_params_ignite;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://ignite_app;
        include /etc/nginx/proxy_params_ignite;
    }
}
