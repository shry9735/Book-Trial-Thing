<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Day of the Science Fair</title>

<!-- Shared look, no shared code — see game/lessons/README.md -->
<link rel="stylesheet" href="/kit/lesson-kit.css" />

<style>
  /* This lesson's own styles. The iframe scopes them here; none of this
     can reach another lesson or the host page. */

  .sf-stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: #14101c center/cover no-repeat;
  }
  .sf-stage::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,16,28,0.55) 0%, rgba(20,16,28,0.78) 55%, rgba(20,16,28,0.94) 100%);
  }
  .sf-layer { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

  /* ── Status bar ──
     The clock is the whole premise of this story — judging is coming
     whether you're ready or not — so it's a distinct, self-contained
     card rather than a sentence with a number awkwardly stuffed in it. */
  .sf-hud {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(58,36,24,0.96), rgba(34,22,14,0.96));
    border-bottom: 2px solid var(--gold-dk);
    flex-shrink: 0;
  }
  .sf-timer {
    display: flex; align-items: center; gap: 11px;
    background: rgba(0,0,0,0.24);
    border: 1px solid rgba(240,168,48,0.4);
    border-radius: 10px;
    padding: 5px 16px 5px 13px;
  }
  .sf-timer-num {
    font-family: Consolas, Menlo, monospace;
    font-size: 1.85rem; font-weight: 800; line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(240,168,48,0.6);
    min-width: 1.3em; text-align: right;
    animation: sf-timer-pulse 2.6s ease-in-out infinite;
  }
  .sf-timer-num.low {
    color: #ff5a3d;
    text-shadow: 0 0 18px rgba(255,90,60,0.8);
    animation: sf-timer-pulse-urgent 0.85s ease-in-out infinite;
  }
  @keyframes sf-timer-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes sf-timer-pulse-urgent {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(1.12); opacity: 0.82; }
  }
  .sf-timer-info { display: flex; flex-direction: column; gap: 2px; }
  .sf-timer-label {
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.09em;
    text-transform: uppercase; color: #f0e4d4; white-space: nowrap;
  }
  .sf-timer-sub {
    font-size: 0.64rem; color: #a89a88; white-space: nowrap;
  }
  .sf-act {
    margin-left: auto;
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold);
    border: 1px solid var(--gold-dk); border-radius: 11px; padding: 3px 10px;
    flex-shrink: 0;
  }
  .sf-notebook { display: flex; gap: 5px; }
  .sf-chip {
    width: 22px; height: 22px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
  }
  .sf-chip.good { background: rgba(52,184,74,0.28); border-color: #34b84a; }
  .sf-chip.risk { background: rgba(212,82,26,0.3);  border-color: var(--orange); }

  /* ── Scene ──
     Character on the left, story text on the right, side by side —
     each gets its own column so a tall sprite or a long passage never
     squeezes the other and spills past the stage edge. */
  .sf-scene {
    flex: 1; display: flex; align-items: stretch;
    padding: 12px 18px 14px; gap: 14px; min-height: 0;
  }
  .sf-char {
    width: 200px; flex-shrink: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; gap: 9px;
  }
  .sf-portrait {
    flex: 1; width: 100%; min-height: 0;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sf-portrait img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    animation: sf-in 0.32s ease backwards;
  }
  @keyframes sf-in { from { opacity: 0; transform: translateY(12px); } }

  .sf-mid { flex-shrink: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 9px; }

  /* Tracer's screen */
  .sf-lcd {
    background: #1c3a24; border: 3px solid #2a2a2a; border-radius: 4px;
    padding: 7px 15px;
    font-family: Consolas, Menlo, monospace; font-size: 0.82rem;
    color: #7dff9b; letter-spacing: 0.07em;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.7), 0 0 20px rgba(60,255,130,0.14);
    animation: sf-in 0.3s ease backwards;
  }

  /* Serial output */
  .sf-serial {
    width: 100%;
    background: #0d1117; border: 2px solid var(--wood); border-radius: 5px;
    padding: 8px 12px;
    font-family: Consolas, Menlo, monospace; font-size: 0.74rem;
    color: #6ee7a0; text-align: left; line-height: 1.55;
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.8);
  }
  .sf-serial .zero { color: #ff7b6b; font-weight: bold; }

  /* ── Text box ── */
  .sf-box {
    background: linear-gradient(180deg, rgba(255,253,248,0.98), rgba(246,240,231,0.98));
    border: 2px solid var(--wood);
    border-radius: 9px;
    padding: 15px 20px 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.32);
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto;
  }
  .sf-box::-webkit-scrollbar { width: 7px; }
  .sf-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sf-p { font-size: 0.88rem; line-height: 1.62; margin-bottom: 9px; color: var(--ink); }
  .sf-p:last-child { margin-bottom: 0; }

  .sf-say {
    border-left: 4px solid var(--orange);
    background: var(--orange-lt);
    border-radius: 0 6px 6px 0;
    padding: 9px 13px; margin: 10px 0;
  }
  .sf-say .who {
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--orange-dk); margin-bottom: 3px;
  }
  .sf-say .line { font-size: 0.88rem; line-height: 1.55; font-style: italic; }

  /* D.U.D.E.A.D.'s aside — a tap-to-read comment, not a wall of text
     blocking the story. The badge only appears when he has something to
     say this beat, and both it and the popup vanish the moment the scene
     moves on — nothing here is allowed to hold. */
  .sf-dude-note {
    align-self: center; flex-shrink: 0;
    position: relative;
    width: 44px; height: 44px;
    border: 2px solid var(--gold-dk); border-radius: 50%;
    background: rgba(0,0,0,0.3);
    padding: 0; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    animation: sf-dude-note-bob 1.7s ease-in-out infinite;
  }
  .sf-dude-note.show { display: flex; }
  .sf-dude-note-avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  }
  .sf-dude-note-bulb {
    position: absolute; top: -11px; right: -7px;
    font-size: 1.15rem;
    filter: drop-shadow(0 0 6px rgba(255,214,80,0.85));
    animation: sf-dude-bulb-flicker 1.7s ease-in-out infinite;
  }
  @keyframes sf-dude-note-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes sf-dude-bulb-flicker {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  .sf-dude-popup {
    position: absolute; left: 16px; bottom: 16px; z-index: 6;
    width: 300px; max-width: calc(100% - 32px);
    border: 2px solid var(--teal); border-radius: 9px;
    background: var(--teal-lt);
    padding: 11px 14px; box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    animation: sf-in 0.16s ease;
  }
  .sf-dude-popup.hide { display: none; }
  .sf-dude-popup .head {
    font-size: 0.63rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--teal-dk); margin-bottom: 5px;
  }
  .sf-dude-popup .body { font-size: 0.8rem; line-height: 1.6; color: var(--ink); }

  /* ── Choices ── */
  .sf-choices { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .sf-choice {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; text-align: left; font-family: inherit;
    font-size: 0.85rem; line-height: 1.45; color: var(--ink);
    background: linear-gradient(180deg, #fff, var(--paper));
    border: 2px solid var(--border); border-radius: 7px;
    padding: 10px 13px; cursor: pointer;
    transition: border-color 0.14s, transform 0.1s, box-shadow 0.14s;
  }
  .sf-choice:hover {
    border-color: var(--orange); transform: translateX(4px);
    box-shadow: 0 3px 11px rgba(0,0,0,0.16);
  }
  .sf-choice .arrow { color: var(--orange); font-weight: 700; flex-shrink: 0; }
  .sf-choice .cost {
    margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    font-size: 0.68rem; font-weight: 700; color: var(--gold-dk);
    background: var(--border-lt); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 8px; white-space: nowrap;
  }
  .sf-choice .cost .ico { font-size: 0.8rem; }

  /* A choice whose cost would blow the judging deadline gets flagged the
     same way spendTime()'s +N popup reads — same color, same "this moves
     the clock" idea, just shown before you commit instead of after. */
  .sf-choice.over { border-style: dashed; }
  .sf-choice .cost.over {
    background: var(--orange-lt); border-color: #f0c8b4; color: var(--orange-dk);
  }

  .sf-next { display: flex; justify-content: flex-end; margin-top: 12px; }

  /* Time jump readout */
  .sf-tick {
    position: absolute; top: 44px; right: 18px; z-index: 5;
    font-family: Consolas, Menlo, monospace; font-size: 0.95rem; font-weight: bold;
    color: #ff8f6b; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    opacity: 0; pointer-events: none;
  }
  .sf-tick.go { animation: sf-tick 1.5s ease forwards; }

  /* A trinket found mid-story. Same float as the clock tick, slower, and
     below it so the two can show at once. */
  .sf-found {
    position: absolute; top: 72px; right: 18px; z-index: 5;
    padding: 6px 12px; border-radius: 10px;
    background: #fff4dc; border: 2px solid var(--gold);
    color: var(--gold-dk); font-weight: 700; font-size: 0.85rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none;
  }
  .sf-found.go { animation: sf-tick 3.2s ease forwards; }
  @keyframes sf-tick {
    0%   { opacity: 0; transform: translateY(0); }
    18%  { opacity: 1; transform: translateY(6px); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(22px); }
  }

  /* ── Ending ── */
  .sf-end-title {
    font-size: 1.5rem; font-weight: 700; color: var(--orange);
    margin-bottom: 4px;
  }
  .sf-scoreline {
    display: flex; gap: 7px; flex-wrap: wrap; margin: 11px 0 2px;
  }
  .sf-tag {
    font-size: 0.7rem; font-weight: 700;
    padding: 4px 11px; border-radius: 12px; border: 1px solid;
  }
  .sf-tag.good { background: #eaf6ec;          color: #1a7a35;          border-color: #b0ddb8; }
  .sf-tag.risk { background: var(--orange-lt); color: var(--orange-dk); border-color: #f0c8b4; }
</style>
</head>
<body>

<div class="sf-stage" id="stage">
  <div class="sf-layer">

    <div class="sf-hud">
      <div class="sf-timer">
        <span class="sf-timer-num" id="left">48</span>
        <span class="sf-timer-info">
          <span class="sf-timer-label" id="timerLabel">Minutes left</span>
          <span class="sf-timer-sub" id="timerSub">Judging starts at 10:00</span>
        </span>
      </div>
      <div class="sf-notebook" id="notebook"></div>
      <span class="sf-act" id="act">Act 1</span>
    </div>

    <div class="sf-scene">
      <div class="sf-char">
        <div class="sf-portrait" id="portrait"></div>
        <div class="sf-mid" id="mid"></div>
        <button class="sf-dude-note" id="dudeNote" type="button" aria-label="D.U.D.E.A.D. has a thought">
          <span class="sf-dude-note-bulb">💡</span>
          <img class="sf-dude-note-avatar" id="dudeNoteAvatar" src="" alt="" />
        </button>
      </div>
      <div class="sf-box" id="box"></div>
    </div>

    <div class="sf-dude-popup hide" id="dudePopup"></div>

  </div>
  <div class="sf-tick" id="tick"></div>
  <div class="sf-found" id="found"></div>
</div>

<script src="/kit/lesson-kit.js"></script>
<script src="story.js"></script>
<script>
/* ==========================================================================
   Story engine.

   Top-level names here (`state`, `el`, `show`, `finish`) are the same ones
   the other interactive lessons use for entirely different things. That is
   deliberate and it is safe: this lesson has its own window.
   ========================================================================== */
'use strict';

var START_MIN = 552;   // 9:12, in minutes past midnight

/* Every risky choice that can come due at judging, in the order it would
   go wrong along the lane — see CONSEQUENCES in story.js. */
var SEEDS = ['debounce', 'loose', 'calib', 'power'];
var JUDGE_MIN = 600;   // 10:00

var state = {
  node:   'start',
  now:    START_MIN,
  seeds:  {},        // planted, may or may not come due
  fired:  [],        // seeds that actually went wrong in Act 3
  caught: [],        // seeds the checklist rescued
  checked: false,
  checklistCut: false, // the judge arrived mid-checklist, so it didn't count
  outOfTime: null    // what you were in the middle of when the judge came
};

/* Which decision each seed belongs to, and what you were doing there if
   the judge turns up before it is done. */
var SEED_OF = { d3: 'loose', debounce: 'debounce', d4: 'power', d5: 'calib' };
var DOING = {
  d1: 'tracking down the swerve', d2: 'tracking down the swerve',
  d3: 'the sensor wiring', debounce: 'the start button',
  d4: 'the power supply', d5: 'the calibration', d6: 'the checklist'
};

function freshState() {
  return { node: 'start', now: START_MIN, seeds: {}, fired: [], caught: [],
           checked: false, checklistCut: false, outOfTime: null };
}

var el = {
  stage:       Ignite.$('#stage'),
  left:        Ignite.$('#left'),
  timerLabel:  Ignite.$('#timerLabel'),
  timerSub:    Ignite.$('#timerSub'),
  notebook:    Ignite.$('#notebook'),
  act:         Ignite.$('#act'),
  portrait:    Ignite.$('#portrait'),
  mid:         Ignite.$('#mid'),
  box:         Ignite.$('#box'),
  tick:        Ignite.$('#tick'),
  found:       Ignite.$('#found'),
  dudeNote:    Ignite.$('#dudeNote'),
  dudeAvatar:  Ignite.$('#dudeNoteAvatar'),
  dudePopup:   Ignite.$('#dudePopup')
};

el.dudeAvatar.src = Ignite.art('characters/dude-ad');

var ACT_OF = {
  start: 1, break: 1, d1: 1, poke: 1, serial: 1, d2: 1, swap: 1, found: 1, d3: 1,
  power_sym: 2, d4: 2, d5: 2,
  d6: 3
};

/* ── HUD ─────────────────────────────────────────────────────────────── */

function clockText(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  return h + ':' + (m < 10 ? '0' + m : m);
}

function drawHud() {
  var left = JUDGE_MIN - state.now;

  if (left > 0) {
    el.left.textContent = left;
    el.timerLabel.textContent = (left === 1 ? 'Minute left' : 'Minutes left');
    el.timerSub.textContent = 'Judging starts at ' + clockText(JUDGE_MIN);
  } else {
    el.left.textContent = '0';
    el.timerLabel.textContent = 'Time’s up';
    el.timerSub.textContent = 'They’re calling your table';
  }
  el.left.classList.toggle('low', left <= 12);

  /* One chip per decision made, so the run so far is always visible. */
  el.notebook.innerHTML = '';
  SEEDS.forEach(function (key) {
    if (!(key in state.seeds)) return;
    var risky = state.seeds[key];
    var chip = document.createElement('span');
    chip.className = 'sf-chip ' + (risky ? 'risk' : 'good');
    chip.textContent = risky ? '!' : '✓';
    chip.title = {
      loose:    risky ? 'Sensor leads left untaped'  : 'Sensor leads taped down',
      debounce: risky ? 'Start button not debounced' : 'Start button debounced',
      power:    risky ? 'Still running on USB power' : 'Battery pack wired in',
      calib:    risky ? 'Calibrated on the carpet'   : 'Calibrated on the gym floor'
    }[key];
    el.notebook.appendChild(chip);
  });
}

function spendTime(mins) {
  if (!mins) return;
  state.now += mins;
  el.tick.textContent = '+' + mins + ' min';
  el.tick.classList.remove('go');
  void el.tick.offsetWidth;          // restart the animation
  el.tick.classList.add('go');
}

/* Hand out an item a choice earns. The server grants each item once, so
   the popup only shows the first time — a replay that makes the same
   choice gets nothing new to announce. */
function awardFound(id) {
  Ignite.award(id, function (granted) {
    if (!granted.length) return;
    var item = granted[0];
    el.found.textContent = (item.icon || '✨') + ' Found: ' + item.name + '!';
    el.found.classList.remove('go');
    void el.found.offsetWidth;
    el.found.classList.add('go');
  });
}

/* ── Rendering ───────────────────────────────────────────────────────── */

function paragraphs(list) {
  return (list || []).map(function (p) {
    return '<div class="sf-p">' + p + '</div>';
  }).join('');
}

function sayBlock(who, line) {
  if (!who) return '';
  return '<div class="sf-say">' +
           '<div class="who">' + who + '</div>' +
           '<div class="line">' + line + '</div>' +
         '</div>';
}

/* D.U.D.E.A.D.'s asides — his badge shows up whenever the current beat
   has one, but the content only appears if you tap it, and it never
   survives into the next beat. Nothing here is allowed to hold. */
var currentNote = null;

function dudeNoteContent(note) {
  return '<div class="head">💡 D.U.D.E.A.D.: ' + note.topic + '</div>' +
         '<div class="body">' + note.body + '</div>';
}

function setDudeNote(note) {
  currentNote = note || null;
  el.dudeNote.classList.toggle('show', !!currentNote);
  el.dudePopup.classList.add('hide');
  el.dudePopup.innerHTML = '';
}

el.dudeNote.addEventListener('click', function () {
  if (!currentNote) return;
  var isHidden = el.dudePopup.classList.contains('hide');
  if (isHidden) {
    el.dudePopup.innerHTML = dudeNoteContent(currentNote);
    el.dudePopup.classList.remove('hide');
  } else {
    el.dudePopup.classList.add('hide');
  }
});

function setScene(node) {
  if (node.art) {
    el.portrait.innerHTML =
      '<img class="lk-sprite" src="' + Ignite.art(node.art) + '" alt="" />';
  }

  var mid = '';
  if (node.lcd) mid += '<div class="sf-lcd">' + node.lcd + '</div>';
  if (node.serial) {
    mid += '<div class="sf-serial">' + node.serial.map(function (line) {
      return line.indexOf(': 0') > -1
        ? '<div class="zero">' + line + '</div>'
        : '<div>' + line + '</div>';
    }).join('') + '</div>';
  }
  if (mid) el.mid.innerHTML = mid;
}

function show(id) {
  var node = STORY[id];
  if (!node) { finish(); return; }

  state.node = id;
  el.act.textContent = 'Act ' + (ACT_OF[id] || 3);
  setScene(node);
  drawHud();
  setDudeNote(node.note);

  var html = paragraphs(node.text) +
             sayBlock(node.who, node.say) +
             paragraphs(node.text2);

  if (node.choices) {
    html += '<div class="sf-choices" id="choices"></div>';
  } else {
    html += '<div class="sf-next"><button class="lk-btn" id="nextBtn">Continue →</button></div>';
  }

  el.box.innerHTML = html;
  el.box.scrollTop = 0;

  if (node.choices) {
    var box = Ignite.$('#choices');
    var left = JUDGE_MIN - state.now;
    node.choices.forEach(function (choice) {
      var mins = choice.cost || 0;
      var over = mins > left;
      var btn = document.createElement('button');
      btn.className = 'sf-choice' + (over ? ' over' : '');
      btn.innerHTML =
        '<span class="arrow">▸</span><span>' + choice.text + '</span>' +
        '<span class="cost' + (over ? ' over' : '') + '">' +
          '<span class="ico">⏱</span>' +
          (mins ? '+' + mins + ' min on the clock' : 'no time added') +
        '</span>';
      /* A readout, not an answer key: the right fix is sometimes the
         cheap one and sometimes not, so the number alone decides nothing. */
      if (over) btn.title = 'This runs past your judging slot.';
      btn.addEventListener('click', function () { choose(choice); });
      box.appendChild(btn);
    });
  } else {
    Ignite.$('#nextBtn').addEventListener('click', function () {
      if (node.next) show(node.next);
      else judging();
    });
  }
}

function choose(choice) {
  spendTime(choice.cost || 0);

  /* Judging does not wait for you to be ready. If this choice runs past
     10:00 — or reaches it anywhere but on the way to the judge — she is
     at your table now, and whatever you were doing is NOT done. This is
     checked before the choice counts for anything: a calibration the
     judge walked in on is not a calibration, a checklist she interrupted
     is not a checklist, and a capacitor still in Spark's bag earns
     nothing. */
  if (state.now > JUDGE_MIN || (state.now >= JUDGE_MIN && choice.to !== 'judging')) {
    if (choice.check) {
      /* Cut off mid-checklist: every fix is already done or skipped, so
         nothing is in pieces — you just don't get the checklist. */
      state.now = JUDGE_MIN;
      state.checklistCut = true;
      drawHud();
      judging();
      return;
    }
    interrupt(state.node);
    return;
  }

  if (choice.award) awardFound(choice.award);

  /* Record every decision, risky or not, so the notebook shows the whole
     run rather than only the mistakes. */
  if (choice.seed) state.seeds[choice.seed] = true;
  else if (SEED_OF[state.node]) state.seeds[SEED_OF[state.node]] = false;

  if (choice.check) state.checked = true;

  drawHud();

  if (choice.to === 'judging') judging();
  else show(choice.to);
}

/* Called on before you're ready. The job you were in the middle of is
   unfinished, and anything you hadn't gotten to yet is still exactly as
   broken as it was when the clock ran out. */
function interrupt(node) {
  state.outOfTime = DOING[node] || 'something';
  state.now = JUDGE_MIN;             // she arrives at ten, not when you'd have finished
  SEEDS.forEach(function (key) {
    if (!(key in state.seeds)) state.seeds[key] = true;
  });

  el.act.textContent = 'Judging';
  setScene({ art: 'characters/spark', lcd: 'UH OH.' });
  setDudeNote(null);
  drawHud();

  el.box.innerHTML =
    paragraphs(['The judge sets her clipboard down at the end of your table. You are halfway through ' +
                state.outOfTime + ' and not ready. Her schedule does not know that.']) +
    sayBlock('Spark', '“We’re not quite...”') +
    paragraphs(['“You are now,” she says.']) +
    '<div class="sf-next"><button class="lk-btn" id="nextBtn">Continue →</button></div>';
  el.box.scrollTop = 0;
  Ignite.$('#nextBtn').addEventListener('click', judging);
}

/* ── Act 3: the seeds come due ───────────────────────────────────────── */

function judging() {
  /* The checklist is a visual inspection — it finds the wire you can see,
     and cannot find a power budget or the wrong calibration surface. */
  var due = SEEDS.filter(function (k) { return state.seeds[k]; });

  if (state.checked && state.seeds.loose) {
    state.caught.push('loose');
    due = due.filter(function (k) { return k !== 'loose'; });
  }
  state.fired = due;

  var queue = due.slice();
  el.act.textContent = 'Judging';
  setDudeNote(null);

  function step() {
    if (!queue.length) { finish(); return; }
    var key  = queue.shift();
    var cons = CONSEQUENCES[key];

    setScene({ lcd: cons.lcd });
    el.box.innerHTML =
      paragraphs(cons.text) +
      '<div class="sf-next"><button class="lk-btn" id="nextBtn">Continue →</button></div>';
    el.box.scrollTop = 0;
    Ignite.$('#nextBtn').addEventListener('click', step);
  }

  /* Opening beat of the judging run, plus anything the checklist saved. */
  var intro = (state.outOfTime ? []
    : state.checklistCut ? [
        'You are halfway down the checklist when the judge sets her clipboard down at the end of your table and asks you to run it. The rest of the list will have to wait.'
      ]
    : ['The judge sets her clipboard down at the end of your table and asks you to run it.']
  ).concat(['Spark puts Tracer on the start line. You press the button.']);
  var rescued = state.caught.map(function (k) { return CONSEQUENCES[k].caught; });

  setScene({ art: 'characters/dude-ad', lcd: state.checked ? 'READY. LET’S GO.' : 'SYSTEMS NOMINAL.' });
  el.box.innerHTML =
    (rescued.length ? paragraphs(rescued) : '') +
    paragraphs(intro) +
    '<div class="sf-next"><button class="lk-btn" id="nextBtn">Continue →</button></div>';
  el.box.scrollTop = 0;
  Ignite.$('#nextBtn').addEventListener('click', step);
}

/* ── Ending ──────────────────────────────────────────────────────────── */

function finish() {
  var n   = state.fired.length;
  var key = state.outOfTime ? 'outOfTime'
          : n === 0 ? (state.caught.length ? 'caught' : 'clean')
          : n === 1 ? 'recovered'
          : n === 2 ? 'rough'
          : 'hard';
  var end = ENDINGS[key];

  /* The host awards the trinket and records the score — a lesson never
     scores itself, it reports what happened. Running out of time caps
     the score well below any finish that got to the judge on time, so
     "do everything, however long it takes" is never the safe play. */
  var score = Math.max(20, 100 - n * 22);
  if (state.outOfTime) score = Math.max(10, Math.min(40, score) - 10);

  el.act.textContent = 'Ending';
  setScene({ art: 'characters/dude-ad', lcd: end.lcd });
  drawHud();
  setDudeNote(null);

  var tags = SEEDS.map(function (k) {
    var label = { debounce: 'Start button', loose: 'Loose connection',
                  calib: 'Calibration', power: 'Power supply' }[k];
    if (state.fired.indexOf(k) > -1) return '<span class="sf-tag risk">' + label + ': failed</span>';
    if (state.caught.indexOf(k) > -1) return '<span class="sf-tag good">' + label + ': caught on the checklist</span>';
    if (state.seeds[k] === false)     return '<span class="sf-tag good">' + label + ': handled</span>';
    return '';
  }).filter(Boolean).join('');

  el.box.innerHTML =
    '<div class="sf-end-title">' + end.title + '</div>' +
    paragraphs(end.text) +
    sayBlock(end.who, end.say) +
    paragraphs(end.text2) +
    '<div class="sf-scoreline">' + tags + '</div>' +
    '<div class="sf-p" style="margin-top:11px;color:var(--ink-dim);font-size:0.8rem">' +
      (state.outOfTime ? 'Out of time at 10:00, halfway through ' + state.outOfTime + '. '
                       : 'Finished at ' + clockText(state.now) + '. ') +
      (n === 0 ? 'Nothing came due in front of the judge.'
               : n + ' problem' + (n === 1 ? '' : 's') + ' came due in front of the judge.') +
    '</div>' +
    '<div class="sf-next" style="gap:9px">' +
      '<button class="lk-btn ghost" id="againBtn">Try Again</button>' +
      '<button class="lk-btn" id="doneBtn">Continue →</button>' +
    '</div>';
  el.box.scrollTop = 0;

  Ignite.$('#againBtn').addEventListener('click', function () {
    state = freshState();
    el.portrait.innerHTML = '';
    el.mid.innerHTML = '';
    show('start');
  });

  Ignite.$('#doneBtn').addEventListener('click', function () {
    Ignite.complete(score);
  });
}

/* ── Boot ────────────────────────────────────────────────────────────── */

Ignite.onReady(function () {
  el.stage.style.backgroundImage = 'url(' + Ignite.art('backgrounds/classroom') + ')';
  Ignite.preload(['characters/spark', 'characters/dude-ad', 'ui/laptop'], function () {
    Ignite.ready();
    show('start');
  });
});
</script>
</body>
