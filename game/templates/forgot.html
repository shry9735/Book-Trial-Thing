<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Your Password — Ignite Academy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}" />
</head>
<body>

<div class="login-stage">
  <div class="login-box">

    <div class="login-crest">
      <div class="mark">🔥</div>
      <div class="title">Ignite Academy</div>
    </div>

    <div class="panel">
      <div class="panel-head teal">Reset Your Password</div>

      <form class="login-form" method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <p class="login-blurb">
          Enter the email on the account and we'll send a link to set a new password.
        </p>

        {% with msgs = get_flashed_messages(with_categories=true) %}
          {% if msgs %}
            <div class="flashes">
              {% for category, message in msgs %}
                <div class="flash-msg {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" autofocus required />
        </div>

        <button type="submit" class="btn block lg teal">Send Reset Link</button>

        <div class="hint-card">
          <a href="{{ url_for('login') }}">Back to sign in</a>
        </div>
      </form>
    </div>

  </div>
</div>

</body>
</html>
