# SPARK! Lost Signal — illustration prompts
#
# One scene per page, keyed by page id (see network.yaml). build_book.py
# turns each into a full prompt in art_prompts.json:
#     style  +  scene  +  a description of every character named in it
# so every character looks the same on every page. Write {SPARK}, {BITSY},
# etc. in a scene to put that character in it.
#
# Written for Flux (ComfyUI). Flux has no negative prompt, so anything to
# avoid is said in the style line. Default canvas is 768×1024 portrait.
#
# Continuity rules for anyone editing these:
#   · "You", the reader, is never shown with a face: hands, sneakers, or an
#     over-the-shoulder view at most.
#   · Ms. Chen only ever appears as a phone screen of text bubbles.
#   · Skylark is a plain white foam box until A1-PAINT. After that it is
#     drawn SAFETY ORANGE with a small round galaxy patch, except on pages
#     only a galaxy-black reader can reach (A1-BLACK, A4-SQUINT). One
#     picture has to serve every reader, and orange is the common case.
#   · Screens and labels show simple shapes and glowing lines, never
#     readable words. Flux renders text badly and the book has the words.

style: >-
  Children's picture-book illustration in a bold, friendly cartoon style:
  clean thick dark outlines, flat cel-shaded colors with soft gradients,
  big expressive eyes, warm saturated palette, sense of adventure and
  curiosity, clear readable composition. Screens and signs show only
  simple shapes, no readable text, no letters, no words, no captions,
  no watermark.

characters:
  SPARK:
    name: Spark
    look: >-
      12-year-old boy, messy spiky blond hair, big brown eyes, rosy cheeks,
      yellow T-shirt under an open maroon vest, maroon trousers, yellow
      canvas sneakers
  BITSY:
    name: Bitsy
    look: >-
      12-year-old girl, warm brown skin, two long dark-brown braids with
      teal hair ties, round purple glasses, teal hoodie with sleeves pushed
      up, dark jeans, white sneakers with purple laces
  DUDE:
    name: D.U.D.E.A.D.
    look: >-
      kid-sized friendly humanoid robot, rounded white boxy head with a wide
      glowing yellow visor showing two big round cartoon eyes and a small
      smile, round yellow ear-pieces, thin antenna topped with a yellow
      ball, white boxy torso with a chunky gold chain necklace, maroon
      segmented arms and legs with gold bolts, oversized yellow sneakers
  TORRES:
    name: Mr. Torres
    look: >-
      calm man in his fifties, short salt-and-pepper hair, neat gray beard,
      red-and-black flannel shirt under a brown canvas work vest, reading
      glasses on a cord
  LINDQVIST:
    name: Mrs. Lindqvist
    look: >-
      sturdy farmer woman in her sixties, short silver hair, tan barn
      jacket, rubber boots
  OKAFOR:
    name: Mr. Okafor
    look: >-
      kind older man, close-cropped gray hair, glasses, cozy green cardigan,
      an orange cat riding on his shoulder
  REYES:
    name: Officer Reyes
    look: >-
      friendly park ranger woman, olive-green uniform, wide-brimmed ranger
      hat, rubber gloves

scenes:

  front: >-
    Book cover. A small safety-orange foam box with a round galaxy patch
    hangs beneath a red parachute and a huge pale weather balloon, high
    above the curved Earth; the sky above is black with a thin glowing blue
    line of atmosphere at the horizon. Far below, tiny on a country road, a
    van with {SPARK}, {BITSY} and {DUDE} leaning out of the windows,
    pointing up in excitement.

  # ── ACT 1 — The Night Before ─────────────────────────────────────────

  A1-OPEN: >-
    Evening in a cozy school maker space with pegboard walls of tools,
    parts drawers and a whiteboard covered in diagrams. On the workbench
    sits a plain white foam box with its lid off, full of small circuit
    boards and wires. {SPARK} digs through a parts drawer, {BITSY} types on
    a sticker-covered laptop, and {DUDE} leans on the bench with arms
    crossed. Warm lamplight, dark window behind.
  A1-BATT: >-
    Close-up at the workbench: {BITSY} holds up a pack of AA batteries
    casually, while {SPARK} frowns and holds up a single battery, a
    thoughtful worried look. Behind them a frosty snowflake doodle on the
    whiteboard hints at cold. Foam box open on the bench.
  A1-ALKALINE: >-
    {BITSY} touches the red and black probes of a yellow multimeter to a
    battery pack inside the open white foam box; the multimeter shows a
    glowing number. {SPARK} looks on, shrugging. In the background {DUDE}
    glances at a thermostat on the wall.
  A1-LITHIUM: >-
    Night parking lot of a small hardware store glowing with light. {SPARK}
    reads the back of a battery package under a streetlamp, {TORRES}
    twirls his car keys beside a van, cold breath clouds in the air.
  A1-FREEZER: >-
    A school break-room freezer door open, frosty mist rolling out; the
    white foam box sits on the top shelf with a long cable trailing out to
    a laptop on the counter. {BITSY} stares at the laptop screen in
    dismay, a graph line dropping. {SPARK} peers into the freezer.
  A1-FREEZER-FIX: >-
    Same break room, now relieved: {BITSY} grins at a laptop showing a
    flat steady graph line, {SPARK} holds a pack of new batteries
    triumphantly, {DUDE} gives a thumbs-up. A frosty freezer in the
    background.
  A1-PAINT: >-
    {BITSY} proudly turns her laptop to show a stunning galaxy design of
    purple nebulae and stars, while {SPARK} holds up a can of
    bright safety-orange spray paint with a challenging grin. The white
    foam box sits between them on the workbench.
  A1-BLACK: >-
    A foam box wrapped in a gorgeous black galaxy print with purple
    nebulae and tiny stars sits on a dark-gray carpet near a doorway; it
    almost disappears against the carpet. In the background {SPARK} squints
    at it from across the room, {BITSY} smiling proudly.
  A1-ORANGE: >-
    Outdoors at night under a parking-lot light, {SPARK} sprays a foam box
    a vivid safety orange while {TORRES} holds the door open; inside, {BITSY}
    presses a round galaxy mission patch onto the side of another
    finished orange box. The orange glows almost neon.
  A1-WARMER: >-
    {SPARK} holds up a small paper hand-warmer packet like a prize; {BITSY}
    reads the back of another packet skeptically, one eyebrow raised.
    Workbench with the open foam box between them.
  A1-WARM: >-
    Close-up of hands taping a small paper hand-warmer packet against a
    battery holder inside a foam box with shiny silver foil tape; soft
    warm glow lines suggest heat. {SPARK}'s hand rests flat on the lid
    nearby.
  A1-NOWARM: >-
    {DUDE} peers into the open foam box from above, curious, a neat and
    tidy arrangement of circuit boards inside. {BITSY} draws a line on a
    whiteboard in the background.
  A1-GPS: >-
    {BITSY} leans close to her laptop, eyes wide, reading a forum page full
    of exclamation-point icons; a tiny GPS circuit board with a ceramic
    square antenna sits beside the laptop. {SPARK} leans back with arms
    folded, unimpressed.
  A1-GPS-VERIFY: >-
    {SPARK} and {BITSY} lean over a printed datasheet table side by side,
    {SPARK} pointing triumphantly at one cell, {BITSY} gasping. The laptop
    screen glows green with a big check mark shape. {DUDE} nods sagely
    behind them.
  A1-GPS-QUICK: >-
    {BITSY} confidently hits the enter key on her laptop, an upload
    progress bar on screen, the GPS board's little light blinking steadily
    on the bench. Relaxed, quick, moving on.
  A1-GPS-SKIP: >-
    {BITSY} closes a browser tab on her laptop while {SPARK} gestures
    proudly at a satellite icon on the screen. Through the window, a night
    sky full of stars.
  A1-SD: >-
    Close-up of a tiny microSD card held between two fingers above the open
    foam box, with {BITSY} looking at it thoughtfully and {SPARK} waving a
    hand dismissively in the background. A laptop shows scrolling lines of
    code as simple bars.
  A1-FLUSH: >-
    {BITSY} theatrically pulls a battery clip out of the foam box while
    {SPARK} watches with arms folded like a referee; on the laptop a long
    list of tidy bars shows every line saved.
  A1-NOFLUSH: >-
    A bright pink sticky note with three big exclamation marks stuck to the
    lid of a sticker-covered laptop; {BITSY} presses it down firmly, {SPARK}
    giving a thumbs-up beside her.
  A1-CAM: >-
    {SPARK} holds up a tiny camera circuit board with a lens the size of a
    pea, eyes shining with excitement, while {BITSY} scribbles math on the
    corner of a greasy pizza box.
  A1-VIDEO: >-
    A laptop screen shows a crisp live video preview of the maker space,
    with {DUDE} waving at the lens; {SPARK} pumps his fist. A pizza box with
    half-finished math lies forgotten under a roll of tape.
  A1-CAMMATH: >-
    A whiteboard filled with big hand-drawn math (shown as boxes, arrows
    and a pie chart, no readable words); a marker in the reader's hand in
    the foreground. {SPARK} stares at the board, mouth open, {BITSY} beside
    it pointing at the result.
  A1-PHOTOS: >-
    {SPARK} carefully mounts the tiny camera behind a round hole in the
    side of the foam box, angling it downward, tongue sticking out in
    concentration. A laptop shows a sharp photo of a parking lot.
  A1-SENSOR: >-
    A tiny purple sensor board sealed inside a zip-top sandwich bag, held
    up between {BITSY}'s fingers; {SPARK} squints at it doubtfully, holding
    a scrap of thin stretchy athletic fabric.
  A1-SEALED: >-
    {BITSY} wraps extra tape around the corner of a sealed sandwich bag
    containing a small purple sensor board, satisfied; {SPARK} quietly drops
    a fabric scrap back into a bin.
  A1-VENTED: >-
    {SPARK} hot-glues a small square of stretchy fabric over a hole in the
    side of the foam box with a glue gun; {BITSY} watches a laptop screen
    where a line flickers. Tidy craftsmanship.
  A1-BEEPER: >-
    A small round black piezo beeper on a tiny circuit board in the
    foreground; behind it {BITSY} and {SPARK} argue good-naturedly, {DUDE}
    between them with a raised hand like a referee.
  A1-BEEP-PRES: >-
    The beeper goes off: {SPARK}, {BITSY} and {DUDE} all cover their ears,
    wincing comically, sound-wave lines bursting from the tiny beeper on
    the bench.
  A1-BEEP-BOTH: >-
    {BITSY} types happily, two glowing paths on her laptop screen merging
    into one; {DUDE} nods approvingly, {SPARK} covering one ear and laughing
    as the beeper sounds.
  A1-ANTENNA: >-
    Close-up: {SPARK} holds a small coiled wire spring antenna between his
    fingers next to a steel ruler, frowning; {BITSY} shrugs beside the
    open foam box with a tiny radio board inside.
  A1-COILED: >-
    {BITSY} stands at the far end of the long maker space by a fire door,
    holding her laptop up triumphantly; {SPARK} at the bench across the
    room gives a slow nod. The room looks long but cozy.
  A1-STRAIGHT: >-
    {SPARK} measures a short straight piece of stiff wire against a steel
    ruler with intense focus, wire cutters in his other hand; {TORRES}
    watches approvingly with arms folded. The foam box has a small wire
    tail sticking straight down from its bottom.
  A1-LABEL: >-
    A cup full of markers on the workbench in the foreground. Behind it,
    {BITSY} yawns hugely, {SPARK} sweeps wire clippings into a dustpan, and
    the nearly finished foam box sits waiting. A wall clock shows late
    evening.
  A1-LABELED: >-
    The reader's hand writes big bold block letters on the side of the
    foam box with a fat black marker (letters shown as abstract bold
    strokes, not readable); {SPARK} points and laughs, {DUDE} reads closely
    with his head tilted.
  A1-NOLABEL: >-
    A single marker being dropped back into a cup; the clean, blank side of
    the foam box beside it. {BITSY} stretches with arms over her head in the
    background.
  A1-SOAK: >-
    {TORRES} stacks chairs at the edge of the maker space, while in the
    foreground a phone glows with a text-message conversation of simple
    blank speech bubbles. {SPARK} and {BITSY} exchange a look over the foam
    box.
  A1-SOAKRUN: >-
    A warm family kitchen at night: the foam box sits open on the kitchen
    table blinking with tiny lights, a laptop beside it, a big bowl of
    popcorn. {SPARK} and {BITSY} sit watching it with homework spread
    around; {DUDE} peeks in from the living room doorway.
  A1-SOAK-CAM: >-
    Kitchen table at night: {SPARK} leans in to point at the tiny camera
    board whose red light has gone dark; {BITSY} stares at a laptop showing
    a full progress bar, worried.
  A1-SOAK-SD: >-
    Kitchen table: {SPARK} reaches for popcorn and his elbow knocks a
    battery clip on the open foam box, with a little comic spark of
    surprise; {BITSY} gasps, hands flying up.
  A1-SOAK-CLEAN: >-
    Midnight kitchen: {SPARK} asleep with his head on the table, {DUDE}
    gently sliding the popcorn bowl away from his face, {BITSY} smiling
    tiredly at a laptop full of tidy data lines. The foam box blinks
    happily.
  A1-QUICKCHECK: >-
    The foam box on the workbench with all its little lights on, {SPARK}
    and {BITSY} giving each other a high-five; {TORRES} reaches for the
    light switch by the door.
  A1-END: >-
    Night outside the school: {TORRES} carries the finished box carefully
    in both hands to a van like a birthday cake, {DUDE} bumping fists with
    the reader's hand in the foreground, {SPARK} and {BITSY} walking ahead
    under the streetlights.

  # ── ACT 2 — Launch Morning ───────────────────────────────────────────

  A2-OPEN: >-
    Early morning at an empty county fairground, frost on the grass, pink
    and gold sunrise. A big blue tarp spread on the field, a tall helium
    tank strapped to the back of a van, a folding table with a kitchen
    scale. {BITSY} wears two winter hats, {SPARK} blows on his hands,
    {DUDE} stands on the tarp with hands on hips like a coach, {TORRES}
    holds up his phone.
  A2-PREDICT: >-
    {BITSY} flattens a printed map on the folding table with mittened
    hands; a curvy pencil line runs across it to a small oval. {SPARK}
    looks at his phone with a frown. Frosty fairground behind them.
  A2-OLDPREDICT: >-
    A folded printed map slides onto the dashboard of a van; through the
    windshield, the frosty fairground and the tarp. {SPARK} slips his
    phone into his pocket.
  A2-REPREDICT: >-
    Close-up of {BITSY}'s phone screen: a map where a curving route bends
    to an oval that is half green land and half blue water. {BITSY},
    {TORRES} and {DUDE} crowd around, faces lit by the screen.
  A2-LAKE: >-
    Three small illustrated map cards fanned out on the folding table, each
    showing a different curved path and landing oval: one stopping near
    green trees, one over farmland with a little clock icon, one touching
    blue water. {BITSY} points at them thoughtfully.
  A2-MOREGAS: >-
    {BITSY} zooms out on her phone: a landing oval sitting on land next to
    a big dark-green forest block on the map. {DUDE} studies it with a
    serious look, {SPARK} nodding with determination.
  A2-WAIT: >-
    The team waits on the edge of the blue tarp: {SPARK} munching a
    granola bar, {BITSY} checking her phone, {TORRES} reading a newspaper
    that is starting to flap in the wind; the fairground flag lifts on its
    pole.
  A2-HOPE: >-
    {BITSY} quietly slips her phone into her pocket, looking uneasy;
    {SPARK} claps his hands cheerfully, {DUDE} watching {BITSY} with a
    knowing look. Bright morning field.
  A2-SPARE: >-
    {BITSY} holds up a fat silver USB power bank proudly; {SPARK} eyes it
    suspiciously. On the folding table, a kitchen scale and the foam box
    wait.
  A2-WEIGH-FIRST: >-
    Close-up of a digital kitchen scale on the folding table with the
    orange foam box on it, the display glowing; {SPARK} holds the silver
    power bank in one hand like he's weighing it by feel, {BITSY} doing
    math on her fingers.
  A2-HEAVY: >-
    {SPARK} peels a long stubborn strip of tape off the lid of the orange
    foam box, grimacing; the kitchen scale beside it glows red. {BITSY} and
    {DUDE} peer into the box.
  A2-STRIP-BANK: >-
    {BITSY} lifts the silver power bank out of the open orange box, a
    rueful smile; {SPARK} pats her shoulder. The scale glows green.
  A2-STRIP-BEEP: >-
    A tiny round beeper board sits alone on the folding table next to a
    hand-warmer packet; in the background {SPARK} tapes the orange box
    shut, glancing back at the beeper uneasily.
  A2-STRIP-CAM: >-
    {BITSY} holds the tiny camera board in her palm, looking down at it
    sadly; a piece of tape covers the round lens hole on the orange box.
    {SPARK} tries to cheer her up.
  A2-GLOVES: >-
    {TORRES} lifts a huge, pale, powdery deflated latex balloon out of its
    bag with bare hands, looking down at his hands thoughtfully; far
    across the frosty lot, the van is a tiny shape. {BITSY} and {SPARK}
    watch.
  A2-GLOVED: >-
    Everyone wiggles bright blue nitrile-gloved fingers: {SPARK} waves his
    at {DUDE}, who looks amused and unbothered; {TORRES} tugs on a glove
    that's too small.
  A2-BAREHAND: >-
    The team carefully unfolds the giant pale balloon on the blue tarp,
    pinching only its edges with bare fingertips; a close-up of {BITSY}'s
    thumb lifting away from the latex.
  A2-FILL: >-
    The balloon swells on the tarp as helium hisses through a hose from the
    tank, rising like something waking up; {TORRES} at the valve, {BITSY}
    holding up a plastic water jug with a hook, {SPARK} grinning up at it.
  A2-FILL-RIGHT: >-
    A plastic water jug hangs perfectly in mid-air from the neck of the
    giant balloon, just off the tarp; {BITSY} holds up a hand saying stop,
    {TORRES} closes the valve, {DUDE} nods slowly.
  A2-FILL-LOW: >-
    A big round balloon sways above the tarp, the hook of the water jug
    still empty on the folding table; {SPARK} pokes the balloon with one
    gloved finger, {TORRES} nodding with satisfaction.
  A2-FILL-HIGH: >-
    An enormous balloon taller than the van strains upward, {SPARK}
    clinging to its tether with both hands, sneakers sliding across the
    tarp, laughing; {BITSY}'s grin fading as she checks a clipboard.
  A2-CHUTE: >-
    A bright red round parachute folded into a long thin fabric sleeve,
    held up by {BITSY} like an umbrella in its cover; {SPARK} frowns at it
    with his hands on his hips.
  A2-CHUTE-OPEN: >-
    The red parachute flaps open and lazy in a light breeze, tied in the
    line between the big balloon above and the orange box below; {TORRES}
    double-checks a knot.
  A2-CHUTE-FOLDED: >-
    A neat red tube of folded parachute hangs perfectly still in the line
    between balloon and orange box; {BITSY} takes a photo of it with her
    phone, {DUDE} eyeing the single wrap of tape doubtfully.
  A2-GONOGO: >-
    {SPARK} holds the orange box with its little lights on, the giant
    balloon tugging upward above it; in the foreground a phone shows a
    text conversation of simple blank speech bubbles. The fairground flag
    is starting to lift.
  A2-CHECK: >-
    Wide shot of the fairground: far away by the fence, tiny figures of
    {SPARK} and {TORRES} walk the balloon and box across the frosty grass;
    in the foreground {BITSY} watches her laptop, counting on her fingers.
  A2-CHECK-ANT: >-
    {SPARK} kneels on the tarp measuring a short straight wire against a
    ruler, wire cutters ready, the orange box upside down in his lap;
    {BITSY} watches her laptop with a strong signal-bar icon.
  A2-GATE: >-
    {TORRES} holds up a licked finger to test the wind beside the
    fairground flagpole, the flag rippling; {BITSY} rolls her eyes
    playfully. A clock face drawn in the sky shows the morning slipping
    away.
  A2-GUSTY: >-
    A strong gust leans the giant balloon far over sideways, the orange box
    swinging out like a pendulum above the tarp; {SPARK} braces holding
    the box, {DUDE} pointing downwind, {TORRES} shouting with a hand cupped
    to his mouth.
  A2-SNAG: >-
    The balloon lunges sideways in a gust and the orange box bounces off
    the frozen grass with a comic impact burst; {BITSY} winces, {SPARK}
    reaching after it. A tiny glint of broken glass on the grass.
  A2-RELEASE: >-
    Looking up from the ground: the huge pale balloon rises into a clear
    blue morning sky, the red parachute and little orange box hanging
    below it; {SPARK}, {BITSY} and {DUDE} tip their heads back to watch,
    arms raised, {TORRES} already jogging toward the van.

  # ── ACT 3 — The Flight ───────────────────────────────────────────────

  A3-OPEN: >-
    Inside a chase van on a country road: {TORRES} driving, {DUDE} in the
    front passenger seat with a big paper map across his knees, {SPARK}
    and {BITSY} squeezed in the back with a laptop across their laps. A
    magnetic antenna visible on the roof through the window, farm fields
    rushing by.
  A3-ROUTE: >-
    The van parked at the fairground with the engine running, exhaust
    puffing; {BITSY} hugs the laptop pleadingly, {SPARK} points urgently
    down the road toward a tiny balloon dot in the sky, {TORRES} waits
    with hands on the wheel.
  A3-STAY: >-
    The van parked alone in the empty fairground lot, heater fog on the
    windows; inside, {BITSY} takes screenshots happily while {SPARK}
    drums his fingers, watching a tiny dot drifting away on the map.
  A3-DRIVE: >-
    The chase van speeds along a two-lane country road through golden
    farmland, a tiny balloon dot high in the blue sky ahead; {SPARK} leans
    out the window pointing up, grinning.
  A3-GAS: >-
    View over {TORRES}'s shoulder of the van dashboard: the fuel needle at
    one quarter; through the windshield, a roadside gas station sign by a
    highway on-ramp with a short line of cars at the pumps.
  A3-GAS-NOW: >-
    The van waits third in line at a small gas station; {BITSY} anxiously
    watches the laptop in the back seat, {TORRES} leaning on the pump
    looking patient, {SPARK} staring up at the sky.
  A3-GAS-LATER: >-
    The van passes a gas station without stopping, the station sliding
    away in the side mirror; {TORRES}'s eyes flick to the fuel gauge.
  A3-CLIMB: >-
    Split view: above, the little orange box under the giant balloon high
    in a deepening blue sky with frost crystals forming on the box; below,
    the van on a tiny road. {SPARK} and {BITSY} lean toward the laptop
    together.
  A3-GPSDROP: >-
    Close-up of the laptop map in the van: a glowing dot frozen in place
    while the radio-wave icon keeps pulsing; {BITSY} pale and anxious,
    {SPARK} scratching his head, {DUDE} turning around from the front seat.
  A3-GPS-TURN: >-
    The van makes a U-turn in a farm driveway, dust swirling; high above
    and far ahead, the balloon keeps drifting the other way. {DUDE} in the
    passenger seat facepalms.
  A3-TEMP: >-
    The laptop screen in the van shows a simple line graph that drops and
    then bends back upward; {BITSY} points at it in confusion, {DUDE} turns
    around from the front seat tapping his own head as if to say think.
  A3-REBOOT: >-
    Close-up of {BITSY}'s finger pressing the enter key, a glowing signal
    beam shooting up from the van's roof antenna into the sky toward a tiny
    box; everyone in the back seat holding their breath.
  A3-REBOOT-OK: >-
    Everyone in the van exhales in relief, slumping back in their seats;
    the laptop shows a radio icon pulsing again. {DUDE} wags a finger
    knowingly from the front.
  A3-REBOOT-DEAD: >-
    High in a dark blue sky, the little box hangs under the balloon covered
    in frost, its tiny lights flickering out one by one; inset below, the
    quiet van with {BITSY}'s hands over her mouth.
  A3-STRATO: >-
    The reader holds up a phone showing a colorful layered diagram of the
    atmosphere: wavy bands from ground to space, with a temperature line
    that zigzags; {SPARK} and {BITSY} lean in amazed, {DUDE} nodding.
  A3-COLDCHECK: >-
    The little foam box hangs under its balloon in a dark navy sky with the
    sun glaring, thick frost creeping across its surface; small icicles
    on the parachute strings. Cold, lonely and beautiful.
  A3-BATTDIE: >-
    Inside the frosted foam box: four batteries rimed with ice, a tiny
    battery-level icon emptying; the circuit boards' little lights dimming.
    Cold blue tones.
  A3-SILENT: >-
    The van parked on the shoulder of an empty country road under a big
    sky; inside, {BITSY} wipes her eyes with her sleeve, {SPARK} stares at
    the silent laptop, {DUDE} turns around gently from the front seat.
  A3-PACKETS: >-
    The laptop map shows a smooth dotted trail with one dot wildly jumping
    off to the far edge of the map; {SPARK} jabs at the stray dot
    excitedly, {BITSY} shakes her head. Through the windshield, a
    crossroads with signs pointing two ways.
  A3-FILTER: >-
    {BITSY} types fast with a determined look; on the laptop, stray dots
    vanish with little puffs and the trail becomes a clean smooth line;
    {SPARK} shrugs and smiles.
  A3-JUMP: >-
    The van bumps down a long empty north road; on the laptop, the trail
    behind them zigzags crazily. {SPARK} sinks low in his seat
    sheepishly, {TORRES} turning the wheel back around.
  A3-BURST: >-
    The weather balloon at its largest, stretched enormous and thin as
    plastic wrap against a black sky, the curve of the Earth below glowing
    blue; the tiny box and red parachute dangling beneath. Tense, still,
    about to pop.
  A3-FLOAT: >-
    The balloon hangs motionless at the edge of space, round and
    unbursting, drifting sideways on fast streaming wind lines over a
    patchwork of clouds; the tiny box beneath it. Lonely and serene.
  A3-FLOAT-CHASE: >-
    The van parked at a highway rest stop at golden hour beside a large
    blank state-line welcome sign; {TORRES} with his hands resting on the
    wheel, the kids staring at a faint balloon dot in the sky far ahead.
  A3-BLIND: >-
    The laptop shows two altitude gauges, one frozen and one stuck low,
    both with question marks; {BITSY} and {SPARK} look at each other in
    confusion, {TORRES} slowing the van.
  A3-TWOALT: >-
    Two big gauge dials on the laptop screen pointing to very different
    heights, one plunging and one barely moving; {BITSY} looks pleadingly
    at the reader, {SPARK} points at one dial.
  A3-WRONGALT: >-
    The van cruising leisurely past a cow pasture; in the sky far ahead, a
    tiny red parachute is already close to the ground. {BITSY} suddenly
    sits bolt upright with wide eyes.
  A3-FALLING: >-
    The balloon bursts into a spray of pale latex shreds against a black
    sky high above the curved Earth; the little box tumbles below as its
    red parachute begins to catch the thin air. Inset: the whole van
    cheering.
  A3-TANGLED: >-
    The orange box plummets through the sky, the red parachute still
    wrapped in its thin sleeve and twisted strings, fluttering uselessly
    like a ribbon; speed lines; farmland rushing up below.
  A3-HILL: >-
    The van at the bottom of a broad farm valley; {SPARK} points urgently
    out the window at a gravel road climbing the ridge, {BITSY} points the
    other way down the valley road, {TORRES} waits with his blinker on.
    The parachute is a tiny red dot in the sky.
  A3-HILLTOP: >-
    The van parked on top of a ridge beside a fence, a sweeping view of
    brown fields, little roads and a tree-lined creek below; the team
    huddles around the laptop on the van's hood. A tiny red parachute
    drifts down in the distance.
  A3-HILL-GOOD: >-
    On the ridgetop, {BITSY} drops a glowing pin on the laptop map with a
    big grin, {SPARK} trying and failing to look modest, {DUDE} grinning at
    him. Far below, a tiny orange speck lands in a field by a farmhouse.
  A3-HILL-WEAK: >-
    On the ridgetop, {BITSY} draws a large circle on a paper map with a
    pencil, frustrated; {SPARK} stares out over the wide valley, hands on
    his head.
  A3-VALLEY: >-
    The van drives along the valley floor; above the ridge on one side,
    the tiny parachute sinks out of sight behind the hill. In the back
    seat {BITSY} draws a huge circle on a paper map.

  # ── ACT 4 — The Search ───────────────────────────────────────────────

  A4-ARRIVE: >-
    The van rolls down a gravel road between wide harvested fields, a red
    barn and a silo in the distance, a happy farm dog running alongside
    the fence. {DUDE} holds a pencil-marked paper map out the window.
  A4-WRONGSIDE: >-
    {DUDE} holds his paper map up beside {BITSY}'s laptop, the two maps
    showing landing ovals in very different places; {TORRES} looks for a
    bridge over a wide river through the windshield.
  A4-GASDETOUR: >-
    Close-up of the van's dashboard: the fuel needle resting on empty, a
    little orange warning light glowing; through the windshield an empty
    country road with more cows than buildings.
  A4-SPLASH: >-
    A wide gray choppy reservoir under a cloudy sky; far out on the water,
    a little orange box bobs upright with a red parachute spread on the
    water beside it like a lily pad. {BITSY} looks through binoculars,
    {SPARK} at the edge of the boat ramp pointing.
  A4-SPLASH-NO: >-
    At the edge of the reservoir, {TORRES} firmly places a hand on the
    reader's shoulder; {SPARK} sits glumly on a rock by the water, {DUDE}
    stands with arms crossed beside {TORRES}, serious and protective.
  A4-SPLASH-RANGER: >-
    Next morning at the misty boat ramp: {REYES} hands a dripping, soggy
    orange box to {BITSY}; a small park boat tied up at the dock behind
    them.
  A4-TREE: >-
    The orange box dangles high in a tall pine tree at the edge of a dark
    forest, its red parachute wrapped around a branch; the team looks up
    from the ground far below, {TORRES} holding up a hand firmly.
  A4-TREE-LINE: >-
    A lead fishing weight on a line sails in an arc over a high pine
    branch; {BITSY} mid-throw with her arm extended, {SPARK} holding the
    reel, both cheering.
  A4-TREE-POLE: >-
    {TORRES} stands on the van's roof rack reaching a long telescoping pole
    saw up into a pine tree toward a red parachute; {OKAFOR} watches
    approvingly from below with the kids.
  A4-TREE-WAIT: >-
    The team sits on the van's back bumper at the forest edge, chins in
    hands, watching the box swing in the wind high in the pine; the
    parachute wrapped even tighter around the branch.
  A4-FENCE: >-
    A waist-high wire fence with a sign on the gate (no readable text)
    along a gravel road; beyond it a wide harvested cornfield and a white
    farmhouse with a warm kitchen light. {SPARK} eyes the fence, {TORRES}
    on the phone with his back turned.
  A4-HOPPED: >-
    In the cornfield, {LINDQVIST} strides toward the kids with her arms
    crossed and a stern expression, the farmhouse screen door swinging
    open behind her; {SPARK} freezes mid-step, {TORRES} hurrying in from
    the road.
  A4-KNOCK: >-
    {LINDQVIST} stands at her farmhouse door with a coffee mug, smiling,
    looking at {BITSY}'s laptop map; then in the next moment the kids ride
    happily in the bed of her pickup across the stubble, {DUDE} sitting on
    the tailgate like he owns it.
  A4-FIND: >-
    The team stands in the middle of a huge harvested field of brown
    stubble rows, wind blowing, crows in the sky; {BITSY} turns her laptop
    in a slow circle, everyone scanning the horizon.
  A4-SQUINT: >-
    A dark plowed field in long late-afternoon shadows; {SPARK} points
    excitedly at a dark lump that turns out to be a rock, {BITSY} shades
    her eyes, {DUDE} scans calmly. Somewhere in the scene, nearly
    invisible, a galaxy-black box blends into the dirt.
  A4-WIDE: >-
    {SPARK} proudly holds up a homemade directional antenna made from
    three pieces of yellow steel tape measure bolted to a white PVC pipe,
    wired to a handheld radio; {BITSY} holds a paper map with a big
    circle.
  A4-TRI: >-
    Close-up of a paper map on the hood of a pickup: three pencil lines
    meet in a tiny triangle in the middle of a field; a compass and the
    tape-measure antenna beside it, {BITSY}'s finger pointing at the
    triangle.
  A4-WANDER: >-
    The team zigzags across a muddy field and a creek, sneakers caked in
    mud; {SPARK}'s arm shakes holding up the tape-measure antenna, a
    dotted zigzag path trailing behind them.
  A4-NEAR: >-
    {SPARK} spins in a circle holding up the tape-measure antenna, comic
    sound waves blasting from the radio in every direction at once;
    {BITSY} covers her ears.
  A4-CIRCLES: >-
    Footprints in the field form big loops and figure eights around the
    team; {BITSY} reads a manual on her phone, {SPARK} lowers the antenna
    in exasperation, {DUDE} deadpan.
  A4-CLOSE: >-
    Everyone stands completely still in the stubble field, holding their
    breath and listening, hands cupped to ears; {DUDE} tilts his head, the
    yellow ear-pieces glowing slightly. A quiet, suspenseful moment.
  A4-BEEP: >-
    Faint sound-wave arcs ripple across the stubble field from somewhere
    unseen; {DUDE} tilts his head with his yellow ear-pieces glowing,
    {BITSY} whispering excitedly, {SPARK} looking every direction.
  A4-DUDE: >-
    {DUDE} strides confidently between stubble rows in his big yellow
    sneakers, pointing down triumphantly at the orange box sitting
    upright in the dirt, red parachute draped across the next row; the
    kids hurry behind him.
  A4-LINE: >-
    The team walks a stubble field in a straight line side by side,
    including {LINDQVIST}, heads down scanning; {BITSY} stops dead with the
    orange box right beside her sneaker.
  A4-SILENTGRID: >-
    A vast quiet stubble field under a lowering sun, long shadows; the
    team stands in silence with no sound waves anywhere, {SPARK} shrugging,
    {BITSY} biting her lip.
  A4-GRID: >-
    Bright pink flagging tape fluttering on cornstalks at regular
    intervals across a stubble field; the team walks the rows side by
    side in an orderly line; {SPARK} pointing at the orange box in the
    dirt ahead.
  A4-RANDOM: >-
    The team scatters in all directions across a huge field, dotted paths
    tangling and overlapping; later they regroup at the pickup, comparing
    notes, puzzled. Golden light fading.
  A4-RECOVER: >-
    The team sprints across the stubble toward the little orange box in
    the dirt, {SPARK} in the lead about to drop to his knees, {BITSY}
    right behind, {TORRES} jogging with a huge smile.
  A4-WRECK: >-
    Close-up of the orange foam box cracked and caved in at one corner,
    lid half torn, parachute still stuck in its sleeve, a loose battery
    clip dangling; {BITSY} gently lifts it, holding it together with both
    hands.
  A4-SHUTOFF: >-
    {SPARK} reaches into the scuffed orange box toward the battery clip,
    and {BITSY}'s hand shoots out to grab his wrist; the box's tiny lights
    still blinking.
  A4-YANK: >-
    {SPARK} carries the dark, silent orange box back toward the road in
    both hands; {BITSY} walks beside him. In the distance the van, a pink
    sticky note visible on a laptop in the back window.
  A4-SHUTDOWN: >-
    {BITSY} kneels in the dirt typing on her open laptop while the box
    beside her blinks a status light twice; {SPARK} waits with his finger
    near the switch, {DUDE} gives an approving thumbs-up.
  A4-CARDS: >-
    Night in the maker space: the muddy box sits open on the workbench;
    {SPARK}, {BITSY}, {DUDE} and {TORRES} crowd around a laptop as {BITSY}
    holds up a tiny memory card between two fingers. Tense and hopeful.
  A4-DARK: >-
    Sunset over flat fields: the sky orange then gray, cornstalks becoming
    black silhouettes; {SPARK}'s phone flashlight makes a tiny circle on
    the dirt, {TORRES} rests a hand on the reader's shoulder, the van
    waiting on the road.
  A4-DARKSEARCH: >-
    The team trudges across an endless field at dusk; in the dirt around
    them, a flapping fertilizer bag, a deflated birthday balloon and a
    lonely work boot. No box anywhere.
  A4-GOHOME: >-
    Night in the van driving home, {BITSY}'s face lit by her phone as she
    types a post with a photo of the balloon launch; {DUDE} reads over her
    shoulder, {SPARK} looks out the dark window.

  # ── ENDINGS ──────────────────────────────────────────────────────────

  E-CURVE: >-
    A large printed photograph pinned on the maker-space wall: a black sky,
    a thin glowing blue line of atmosphere, and the gently curved Earth
    below. {DUDE} stands before it with arms crossed in awe, {SPARK} and
    {BITSY} arm in arm beside him.
  E-CURVE-CAUGHT: >-
    The curve-of-the-Earth photo pinned on the maker-space wall next to a
    handwritten checklist page with tick marks (no readable words);
    {BITSY} pins the list proudly while {SPARK} and {DUDE} high-five.
  E-LOWBURST: >-
    A photo on the wall shows a deep rich-blue sky and a hazy, barely
    curved horizon; {SPARK} gazes up at the top of the photo wistfully,
    {BITSY} with a hand on his shoulder.
  E-HALFWAY: >-
    The team watches a video on a laptop that freezes on a frame of
    deep-blue sky and a slightly curved horizon; {SPARK} buries his face in
    his hands, {BITSY} holds up a greasy pizza box covered in math.
  E-NOPICS: >-
    A neat altitude graph shaped like a mountain pinned on a hallway wall;
    students walk past without looking; {SPARK} and {BITSY} stand beside it,
    smiling a little sadly.
  E-NODATA: >-
    A beautiful curve-of-the-Earth photo on a laptop screen next to an
    empty file icon; {BITSY} sticks a new sticky note onto her laptop lid
    with determination.
  E-EMPTY: >-
    The muddy, dented box sits on the workbench under a lamp; {SPARK} and
    {BITSY} stare at an empty laptop screen; {DUDE} rests a comforting hand
    on {SPARK}'s shoulder.
  E-SOGGY: >-
    A bowl of uncooked rice holding two tiny memory cards next to a soggy
    orange box with green-crusted circuit boards spread on a towel; {BITSY}
    smiles as a laptop shows a photo of the Earth's curve.
  E-SOGGY-BLANK: >-
    A soggy orange box and ruined green-crusted circuit boards spread on a
    towel; {BITSY} underlines two lines on a whiteboard (no readable text)
    with a firm stroke, {SPARK} nodding.
  E-TREE: >-
    Winter: the orange box hangs in the snowy pine tree, dusted with snow,
    parachute frozen to the branch; below, {OKAFOR} looks up from his
    snowy yard with his cat.
  E-COWS: >-
    A herd of curious cows stands around the trampled, chewed remains of
    the orange foam box in a muddy field; {DUDE} carries the pieces,
    {LINDQVIST} with arms crossed but kind, {SPARK} and {BITSY} looking
    sheepish.
  E-FLOATER: >-
    The balloon drifting far away over a vast ocean of clouds at sunset,
    tiny and alone at the edge of space; a bittersweet, beautiful scene.
  E-RETURN: >-
    In front of the school, the kids hand a big pizza box to a smiling
    farmer in overalls and a cap who holds a weathered, cracked orange
    box; {DUDE} grins in the background.
  E-LOST: >-
    A lonely foam box sitting in a vast empty field under a sky full of
    stars, tiny and forgotten; far away on the horizon, the lights of a
    town.
  E-GROUNDED: >-
    A deflated balloon slumps across the blue tarp like a bedsheet in a
    windy fairground, the flag snapping straight out; the orange box sits
    on the folding table, never launched; {BITSY} hugs her knees,
    {TORRES} closing the valve on the helium tank.
