# Ignite Academy — app + Postgres.
#
#   cp .env.example .env      # then edit: SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose logs -f app
#
# Good for one box. Past that, move Postgres to a managed service so
# backups and point-in-time recovery are somebody else's job, and drop the
# db service here — see DEPLOY.md.
#
# The RAG side of this repo (ingest.py, query.py) is a separate local tool
# and is not part of this deployment; its qdrant service lives in
# docker-compose.rag.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ignite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ignite}
      # Data checksums catch silent corruption on the way back off disk,
      # which is the failure you most want to hear about early.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Not published to the host: only the app network reaches Postgres.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignite} -d ${POSTGRES_DB:-ignite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ignite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ignite}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      TRUSTED_PROXIES: "1"
      COOKIE_SECURE: "true"
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Ignite Academy <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CDN_URL: ${CDN_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params_ignite:/etc/nginx/proxy_params_ignite:ro
      # Static files are served straight off disk here, never through a
      # Python worker. Read-only: nginx has no reason to write to them.
      - ./game/static:/srv/static:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
